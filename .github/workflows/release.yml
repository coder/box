# Build and release ISO — builds the installer AND appliance ISOs for every
# supported architecture and publishes them as assets on a GitHub Release.
#
# Trigger either way:
#   * push a tag matching v*  (e.g. `git tag v1.2.0 && git push origin v1.2.0`)
#   * run manually from the Actions tab (workflow_dispatch), supplying a tag
#     and optionally a ref/commit to build.
#
# Like test.yml, each arch builds on its own native runner with Nix installed
# directly on the host (DeterminateSystems/nix-installer-action) and the
# /nix/store cached across runs (nix-community/cache-nix-action). Bare
# `make <target>` resolves to
# the runner's native currentSystem; the resulting ISO + its .sha256 sidecar are
# dereferenced into a host mktemp dir. Each ISO is published as a GitHub Actions
# artifact (not a release asset: assets are capped at 2 GiB and the ISOs exceed
# it) and the release body carries a table linking each kind/arch to its
# artifact. This is a stopgap until the ISOs move to S3, at which point only the
# upload steps and the iso-table action's links change.

name: Build and release ISO

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create/publish (e.g. v1.2.0)"
        required: true
        type: string
      ref:
        description: "Git ref/commit to build (defaults to the tag/branch)"
        required: false
        type: string
      prerelease:
        description: "Mark the release as a pre-release"
        required: false
        default: false
        type: boolean

# Only one release run per tag at a time.
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  # Force plain, greppable Nix output in CI logs. Nix's default animated
  # multi-line progress bar renders as unreadable ANSI redraw noise in the
  # GitHub Actions log viewer; `--log-format raw` prints one line per event and
  # `--print-build-logs` streams the actual builder output. The Makefile passes
  # $(NIX_OUTPUT_FLAGS) to every nix invocation (build / eval / flake check).
  NIX_OUTPUT_FLAGS: --log-format raw --print-build-logs

jobs:
  build:
    name: ${{ matrix.kind }} (${{ matrix.system }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - kind: Installer
            target: installer
            system: x86_64-linux
            runner: ubuntu-24.04
          - kind: Installer
            target: installer
            system: aarch64-linux
            runner: ubuntu-24.04-arm
          - kind: Appliance
            target: appliance
            system: x86_64-linux
            runner: ubuntu-24.04
          - kind: Appliance
            target: appliance
            system: aarch64-linux
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Empty for tag push (checks out the tag); honored for manual dispatch
          # to release an arbitrary commit.
          ref: ${{ github.event.inputs.ref }}

      # Install Nix natively + cache the /nix/store (shared with the test
      # workflow so releases build the exact same way).
      - name: Set up Nix
        uses: ./.github/actions/setup-nix

      # Build the full ISO via the shared action. No ISO_COMPRESSION / PR
      # stamping inputs: releases keep the slow nixpkgs default (small shipped
      # ISOs) and their plain version names.
      - name: Build ISO
        id: build
        uses: ./.github/actions/build-iso
        with:
          target: ${{ matrix.target }}
          system: ${{ matrix.system }}

      # Publish the ISO + its .sha256 sidecar as one artifact per kind (a single
      # upload-artifact step uploads matched files CONCURRENTLY). Named
      # coder-box-<target>-<system> so the iso-table renderer can resolve each
      # kind/arch to its download URL. Kept for the max public-repo retention.
      - name: Upload ISO artifact
        uses: actions/upload-artifact@v6
        with:
          name: coder-box-${{ matrix.target }}-${{ matrix.system }}
          path: |
            ${{ steps.build.outputs.dist }}/*.iso
            ${{ steps.build.outputs.dist }}/*.iso.sha256
          retention-days: 90
          if-no-files-found: error

      # Tiny size metadata (written by build-iso) the release job renders into
      # the release-body table. Named per target+system so merge-multiple can't
      # clash when both kinds share an arch.
      - name: Upload ISO size metadata
        uses: actions/upload-artifact@v6
        with:
          name: iso-meta-${{ matrix.target }}-${{ matrix.system }}
          path: ${{ steps.build.outputs.dist }}/iso-sizes-*.tsv
          retention-days: 90
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      # listWorkflowRunArtifacts (download links) reads the run's artifacts.
      actions: read
    steps:
      # Checkout so the local iso-table composite action is available.
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.ref }}

      - name: Determine release tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            tag="${{ github.event.inputs.tag }}"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          echo "Releasing tag: $tag"

      # Only the tiny size metadata is needed here; the multi-GB ISOs stay as
      # artifacts and are linked from the release body, never re-downloaded.
      - name: Download ISO size metadata
        uses: actions/download-artifact@v7
        with:
          path: meta
          pattern: iso-meta-*
          merge-multiple: true

      # Same renderer the test workflow uses for its sticky PR comment; here its
      # output becomes the release body. 90-day expiry note matches the
      # artifacts' retention.
      - name: Render ISO table
        id: table
        uses: ./.github/actions/iso-table
        with:
          meta-dir: meta
          expiry-days: "90"

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          body: ${{ steps.table.outputs.table }}
          generate_release_notes: true
          prerelease: ${{ github.event.inputs.prerelease || false }}
